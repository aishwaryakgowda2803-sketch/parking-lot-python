
version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12.11
    steps:
      - checkout
      - run:
          name: Install Ruff
          command: pip install ruff
      - run:
          name: Check code quality
          command: ruff check app tests

  unit-tests:
    docker:
      - image: cimg/python:3.12.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            pip install -r requirements.txt
            pip install pytest pytest-cov
      - run:
          name: Run unit tests and check coverage
          command: python -m pytest tests/test_pricing.py --cov=app.pricing --cov-report=term-missing --cov-fail-under=70

  integration-tests:
    machine: true
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: |
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest
      - run:
          name: Start application and services
          command: docker compose up -d --build
      - run:
          name: Run integration tests
          command: |
            . .venv/bin/activate
            python -m pytest tests/test_integration.py -q
      - run:
          name: Stop application and services
          command: docker compose down -v
          when: always

  docker-build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build parking lot Docker image
          command: docker build -t parking-lot-python:ci .

workflows:
  parking-lot-ci:
    jobs:
      - lint
      - unit-tests
      - integration-tests
      - docker-build:
          requires:
            - lint
            - unit-tests
            - integration-tests
